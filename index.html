
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Movie World</title>
<style>
body {
  margin: 0;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #202033;
  padding: 20px;
}
h1 { color: #ffca28; }
input {
  width: 90%;
  padding: 12px;
  border-radius: 8px;
}
main { padding: 16px; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.card {
  background: #252538;
  padding: 14px;
  border-radius: 10px;
}
.poster {
  font-size: 48px;
  text-align: center;
  padding: 20px 0;
}
button {
  background: #ffca28;
  border: 0;
  padding: 10px;
  border-radius: 6px;
}
</style>
</head>
<body>
<header>
<h1>🎬 My Movie World</h1>
<p>Discover Movies & Official Trailers</p>
<input id="search" placeholder="Search movies...">
</header>
<main>
<h2>🔥 Featured Movies</h2>
<div class="grid" id="movies"></div>
</main>
<script>
const films = [
 {title:"Classic Stories", icon:"🎞️", year:"Classic"},
 {title:"Adventure World", icon:"🌍", year:"Adventure"},
 {title:"Comedy Time", icon:"😄", year:"Comedy"},
 {title:"New Discoveries", icon:"✨", year:"Featured"}
];
const area = document.getElementById("movies");
function render(q="") {
 area.innerHTML="";
 films.filter(f=>f.title.toLowerCase().includes(q.toLowerCase()))
 .forEach(f=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML='<div class="poster">'+f.icon+'</div>';
  const title=document.createElement("h3");
  title.textContent=f.title;
  const desc=document.createElement("p");
  desc.textContent=f.year+" · Demo";
  card.append(title,desc);
  area.append(card);
 });
}
document.getElementById("search").addEventListener(
 "input",e=>render(e.target.value)
);
render();
</script>
</body>
</html>
